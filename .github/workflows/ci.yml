name: Arogyasathi CI / CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-evaluation:
    name: Python Engine & Official Evaluator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx uvicorn pandas numpy

      - name: Run Python Unit Tests
        run: |
          PYTHONPATH=FULL_CODE python -m pytest FULL_CODE/tests/ -v

      - name: Run Official Evaluator Check
        run: |
          python FULL_CODE/run_pipeline.py --split dev --out submission_dev
          python H5_Frontline_Health_Worker_Companion/evaluate.py \
            --submission submission_dev \
            --truth H5_Frontline_Health_Worker_Companion/data/dev_truth.jsonl \
            --out score_dev.json

  android-build:
    name: Native Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        run: |
          cd android_app
          ./gradlew test

      - name: Build Android Debug APK
        run: |
          cd android_app
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arogyasathi-Debug-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
